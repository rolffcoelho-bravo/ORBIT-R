name: Validate real OPS-SAT source and historical replay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[server]'
      - name: Download original measured telemetry and verify pinned source
        run: python -m orbitr.cli fetch-data --data data/raw/segments.csv
      - name: Audit raw source, labels and split
        run: python -m orbitr.cli audit-data --data data/raw/segments.csv
      - name: Replay genuine historical measurements into SQLite
        run: python -m orbitr.cli replay --data data/raw/segments.csv --db data/state/monitor.sqlite3
      # No raw data, private IP or generated results uploaded as workflow artifacts.

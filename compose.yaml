services:
  monitor:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ORBITR_DATA: /app/data/raw/segments.csv
      ORBITR_DB: /app/data/state/monitor.sqlite3
      ORBITR_PACE: "0.4"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - orbitr-state:/app/data/state
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
volumes:
  orbitr-state:

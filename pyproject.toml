[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "orbitr-research"
version = "0.1.0"
description = "Public reference implementation for actual spacecraft telemetry replay"
requires-python = ">=3.11"
[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
orbitr = "orbitr.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
orbitr = ["web.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
